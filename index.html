<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a101b">
    <title>TUPAC / Localization Lab</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: #0a101b; color: #eef2f8; font: 14px system-ui, sans-serif; }
        header { height: 66px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #253044; }
        .identity { display: flex; align-items: center; gap: 12px; }
        .mark { width: 27px; height: 27px; border: 1px solid #80e5ba; border-radius: 50%; display: grid; place-items: center; color: #80e5ba; font-size: 20px; }
        strong { letter-spacing: .16em; font-size: 13px; }
        .subtitle { color: #92a0b6; font-size: 11px; letter-spacing: .08em; margin-top: 2px; }
        nav { display: flex; padding: 4px; border: 1px solid #293449; border-radius: 8px; gap: 3px; }
        nav a { color: #a8b4c8; text-decoration: none; padding: 7px 12px; border-radius: 5px; font-size: 12px; white-space: nowrap; }
        nav a[aria-current] { background: #233344; color: #c4ffe4; box-shadow: inset 0 0 0 1px #3b5b5a; }
        a:focus-visible { outline: 2px solid #80e5ba; outline-offset: 2px; }
        iframe { width: 100%; height: calc(100% - 66px); display: block; border: 0; background: #0a101b; }
        @media (max-width: 450px) { header { padding: 0 12px; } .subtitle { display: none; } nav a { padding: 7px 9px; } .identity { gap: 8px; } }
    </style>
</head>
<body>
    <header>
        <div class="identity"><span class="mark" aria-hidden="true">+</span><div><strong>TUPAC</strong><div class="subtitle">ROBOTIC LOCALIZATION LAB</div></div></div>
        <nav aria-label="Simulation edition">
            <a href="#classic" id="classic-link">Classic</a>
            <a href="#2026" id="modern-link">2026 Lab</a>
        </nav>
    </header>
    <iframe id="edition" title="Robotic localization simulation"></iframe>
    <noscript><p><a href="classic.html">Classic</a> / <a href="lab/index.html">2026 Lab</a>. Simulations require JavaScript.</p></noscript>
    <script>
        function showEdition() {
            // Unload the inactive simulation so it consumes no CPU in the background.
            const modern = location.hash === "#2026";
            document.getElementById("edition").src = modern ? "lab/index.html" : "classic.html";
            document.getElementById("edition").title = modern ? "2026 localization lab" : "Classic localization simulation";
            const active = document.getElementById(modern ? "modern-link" : "classic-link");
            const inactive = document.getElementById(modern ? "classic-link" : "modern-link");
            active.setAttribute("aria-current", "page");
            inactive.removeAttribute("aria-current");
        }
        addEventListener("hashchange", showEdition);
        showEdition();
    </script>
</body>
</html>
